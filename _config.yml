title: AI 情报站
subtitle: 每天，把重要的 AI 新事讲明白
description: 聚合全球 AI 官网、研究博客、GitHub 与中文科技资讯，提供经过筛选、溯源和整理的每日情报。
keywords:
  - AI 资讯
  - 人工智能
  - Agent
  - 大模型
  - 开源
author: AI 情报主编
language: zh-CN
timezone: Asia/Shanghai

url: https://ai.dduke.cn
root: /
permalink: intelligence/:year/:month/:day/:title/
permalink_defaults: null
pretty_urls:
  trailing_index: false
  trailing_html: false

source_dir: source
public_dir: public
tag_dir: blog/tags
archive_dir: blog/archives
category_dir: blog/categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - CNAME
  - .nojekyll

new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

index_generator:
  path: ''
  per_page: 10
  order_by: -date
per_page: 10
pagination_dir: page

theme: stellar

search:
  path: search.json
  field: all
  content: true
  format: html

marked:
  prependRoot: false
  postAsset: false
  smartypants: false

deploy: null
