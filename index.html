<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="AI 情报站：每日聚合值得关注的 AI 产品、模型、研究与行业动态。" />
    <title>AI 情报站</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #070b12;
        color: #f3f6fb;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 20% 0%, #17305d 0, transparent 32rem), #070b12; }
      main { width: min(920px, calc(100% - 40px)); margin: 0 auto; padding: 96px 0 64px; }
      .eyebrow { color: #7dd3fc; font-size: 14px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
      h1 { margin: 18px 0; max-width: 760px; font-size: clamp(42px, 8vw, 76px); line-height: 1.02; letter-spacing: -.045em; }
      .intro { max-width: 680px; color: #aebbd0; font-size: 19px; line-height: 1.8; }
      .status { display: inline-flex; align-items: center; gap: 10px; margin-top: 32px; padding: 11px 16px; border: 1px solid #26344a; border-radius: 999px; background: rgba(11, 18, 30, .78); color: #d7e0ed; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #34d399; box-shadow: 0 0 18px #34d399; }
      footer { margin-top: 120px; color: #718096; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow">AI Intelligence Daily</div>
      <h1>每天，把重要的 AI 新事讲明白。</h1>
      <p class="intro">聚合全球 AI 官网、研究博客、GitHub 与中文科技资讯，为「AI 情报主编」提供经过筛选、溯源和整理的每日素材。</p>
      <div class="status"><span class="dot"></span>情报系统正在搭建中</div>
      <footer>© 2026 AI 情报站 · ai.dduke.cn</footer>
    </main>
  </body>
</html>
